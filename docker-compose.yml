services:
  web:
    build: .
    image: mini-app-docker:1.0.0
    container_name: mini-app
    ports:
      - "8080:8080"
    environment:
      APP_VERSION: "1.0.0"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8080/health').status==200 else 1)"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
